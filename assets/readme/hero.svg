<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">WorkBar：macOS 菜单栏本地工作预算计时器</title>
  <desc id="desc">WorkBar 将今日工作预算分配给任务，并用一个共享活动计时器记录每项任务的实际用时。</desc>

  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#202b34"/>
      <stop offset="1" stop-color="#141b22"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8f2df"/>
      <stop offset="1" stop-color="#7edfc0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="28" fill="#10161c"/>
  <path d="M56 316H1144" stroke="#34434d" stroke-width="1"/>
  <path d="M56 64H520" stroke="#b8f2df" stroke-opacity=".5" stroke-width="2"/>
  <circle cx="56" cy="64" r="4" fill="#ffbd6b"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <g transform="translate(56 94)">
      <text x="0" y="0" fill="#b8f2df" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2">MACOS / OFFLINE / MENU BAR</text>
      <text x="0" y="72" fill="#f5f7f8" font-size="68" font-weight="700" letter-spacing="-2">WorkBar</text>
      <text x="0" y="116" fill="#d6e0e4" font-size="28" font-weight="500">把今天的工作，变成可暂停的任务沙漏。</text>
      <text x="0" y="156" fill="#8fa0aa" font-size="20">预算 → 任务 → 一个活动计时器 → 本地保存</text>

      <g transform="translate(0 190)">
        <rect width="142" height="38" rx="19" fill="#b8f2df"/>
        <text x="71" y="25" text-anchor="middle" fill="#10161c" font-size="17" font-weight="700">今日预算</text>
        <path d="M154 19H190" stroke="#ffbd6b" stroke-width="2"/>
        <circle cx="190" cy="19" r="5" fill="#ffbd6b"/>
        <rect x="204" width="142" height="38" rx="19" fill="#26343d" stroke="#465963"/>
        <text x="275" y="25" text-anchor="middle" fill="#d6e0e4" font-size="17" font-weight="600">任务计时</text>
        <path d="M358 19H394" stroke="#ffbd6b" stroke-width="2"/>
        <circle cx="394" cy="19" r="5" fill="#ffbd6b"/>
        <rect x="408" width="142" height="38" rx="19" fill="#26343d" stroke="#465963"/>
        <text x="479" y="25" text-anchor="middle" fill="#d6e0e4" font-size="17" font-weight="600">提醒事项</text>
      </g>
    </g>

    <g transform="translate(682 30)">
      <rect width="462" height="286" rx="22" fill="url(#surface)" stroke="#43525c"/>
      <circle cx="34" cy="35" r="16" fill="#b8f2df"/>
      <path d="M28 26h12l-4 7 4 10H28l4-10z" fill="#10161c"/>
      <text x="62" y="32" fill="#f5f7f8" font-size="20" font-weight="700">WorkBar</text>
      <text x="62" y="52" fill="#8fa0aa" font-size="14">今日工作计划</text>
      <text x="414" y="39" text-anchor="end" fill="#b8f2df" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">01:40</text>

      <rect x="24" y="76" width="414" height="78" rx="16" fill="#f5f7f8"/>
      <text x="44" y="103" fill="#6b7a83" font-size="13" font-weight="600" letter-spacing="1">TODAY'S CAPACITY</text>
      <text x="44" y="135" fill="#10161c" font-size="29" font-weight="700">08:00</text>
      <text x="404" y="111" text-anchor="end" fill="#6b7a83" font-size="13">已用 01:10</text>
      <rect x="44" y="141" width="370" height="6" rx="3" fill="#d7dfe1"/>
      <rect x="44" y="141" width="106" height="6" rx="3" fill="#10161c"/>

      <g transform="translate(24 176)">
        <rect width="414" height="42" rx="12" fill="#26343d" stroke="#3b4a54"/>
        <rect width="4" height="42" rx="2" fill="#b8f2df"/>
        <circle cx="24" cy="21" r="8" fill="none" stroke="#b8f2df" stroke-width="2"/>
        <path d="M24 16v5l4 3" fill="none" stroke="#b8f2df" stroke-width="2" stroke-linecap="round"/>
        <text x="46" y="26" fill="#f5f7f8" font-size="18" font-weight="600">Write project brief</text>
        <text x="390" y="26" text-anchor="end" fill="#b8f2df" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">01:40</text>
      </g>
      <g transform="translate(24 228)">
        <rect width="414" height="42" rx="12" fill="#1a242b"/>
        <circle cx="24" cy="21" r="8" fill="none" stroke="#71838d" stroke-width="2"/>
        <text x="46" y="26" fill="#c2cdd1" font-size="18">Review experiment results</text>
        <text x="390" y="26" text-anchor="end" fill="#8fa0aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">01:10</text>
      </g>
    </g>

    <g transform="translate(682 346)">
      <text x="0" y="0" fill="#8fa0aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">ONE ACTIVE TASK · EVENTKIT · JSON STATE</text>
      <circle cx="408" cy="-6" r="4" fill="#ffbd6b"/>
    </g>
  </g>
</svg>
